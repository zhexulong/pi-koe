name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Pipeline shape on every push to main / pull request:
#
#   check-gateway        (windows-latest, parallel)
#                        └─ install → build:protocol → build → test → typecheck
#   check-extension      (ubuntu-latest, parallel)
#                        └─ install → extension-smoke (pi extension loads
#                           and registers /voice without a real pi process)
#   check-release        (windows-latest, parallel)
#                        └─ install → build:release-artifact → verify the
#                           single-file bundle + protocol + ps1 helpers are
#                           present and non-empty
#
# All jobs are independent; on main every leg must be green. The gateway suite
# runs on Windows because speech tests exercise WinMM/PowerShell spawn paths
# (through fakes — no real audio device is required). The extension check runs
# on Ubuntu to prove pi-ecosystem compatibility on a stock runner; it only
# loads the extension entry with a fake pi API, it never spawns the gateway.

jobs:
  check-gateway:
    name: Check (gateway)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gateway must consume an independently compiled and tested protocol.
      - name: Build protocol
        run: pnpm run build:protocol

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build gateway
        run: pnpm run build

      - name: Test
        run: pnpm run test

  check-extension:
    name: Check (pi extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Loads extensions/index.ts with a fake pi API, asserts exactly one
      # /voice command registers, session_shutdown is wired, and status/stop
      # behave without a running child.
      - name: Extension smoke
        run: pnpm run test:extension

  check-release:
    name: Check (release artifact)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol
        run: pnpm run build:protocol

      - name: Build gateway
        run: pnpm run build

      # Production staging (GameBuddy host) consumes this single-file bundle
      # plus the protocol bundle and the two Windows PowerShell helpers; any
      # missing piece makes a generation unstartable, so verify them here.
      - name: Build release artifact
        run: pnpm run build:release-artifact

      - name: Verify release artifact closure
        shell: pwsh
        run: |
          $entry = ".dist/entry/voice-gateway-entry.mjs"
          $protocol = ".dist/protocol/voice-protocol-index.mjs"
          $waveout = ".dist/windows-waveout.ps1"
          $wavein = ".dist/windows-wavein.ps1"
          $missing = @($entry, $protocol, $waveout, $wavein) | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            Write-Error "voice_release_bundle_missing: $($missing -join ', ')"
            exit 1
          }
          foreach ($file in @($entry, $protocol, $waveout, $wavein)) {
            $size = (Get-Item $file).Length
            if ($size -le 0) {
              Write-Error "voice_release_bundle_empty: $file"
              exit 1
            }
          }
          Write-Output "voice_release_bundle_ok entry=$(Get-Item $entry | Select-Object -ExpandProperty Length) protocol=$(Get-Item $protocol | Select-Object -ExpandProperty Length) waveout=$(Get-Item $waveout | Select-Object -ExpandProperty Length) wavein=$(Get-Item $wavein | Select-Object -ExpandProperty Length)"